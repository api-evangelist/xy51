aid: xy51
name: Xiao-Y Technology (小y科技)
description: Xiao-Y Technology (小y科技), operated by Beijing Shiyou Interactive Technology
  Co., Ltd. (北京视游互动科技有限公司), is a Chinese smart-TV and big-screen gaming platform behind
  the 小y游戏厅 TV game store and YFans app, publishing licensed TV editions of titles
  like 葫芦娃, 胡莱三国2, 我叫MT2, and 中超荣耀. Its 小y手游开放平台 developer platform onboards game
  studios through first-party YTS SDKs (Android Fusion and iOS) rather than a public
  REST API, covering registration, qualification review, game submission, and revenue
  sharing. A Qiming Venture Partners portfolio company.
